                if (!events[day]) events[day] = [];
                events[day].push({ label, color, amount });
            };

            // Installments - due date OR startDate recurring monthly
            state.debts.installments.forEach(d => {
                if (d.left <= 0) return;
                // recurring monthly payment on same day as startDate
                const start = new Date(d.startDate || d.date || todayStr);
                const payDay = start.getDate();
                if (payDay <= daysInMonth) {
                    const eventDate = new Date(cy, cm, payDay);
                    if (eventDate >= new Date(d.startDate || d.date)) {
                        addEvent(payDay, d.name, '#f43f5e', d.amount);
                    }
                }
                // also mark the final due date if in this month
                if (d.dueDate) {
                    const due = new Date(d.dueDate);
                    if (due.getMonth() === cm && due.getFullYear() === cy) {
                        addEvent(due.getDate(), d.name + ' (Final)', '#f97316', d.amount);
                    }
                }
            });
            // oweTo debts - date added
            state.debts.oweTo.forEach(d => {
                const dt = new Date(d.date);
                if (dt.getMonth() === cm && dt.getFullYear() === cy) {
                    addEvent(dt.getDate(), d.name, '#ec4899', d.amount);
                }
            });
            // owedToMe debts
            state.debts.owedToMe.forEach(d => {
                const dt = new Date(d.date);
                if (dt.getMonth() === cm && dt.getFullYear() === cy) {
                    addEvent(dt.getDate(), d.name, '#10b981', d.amount);
                }
            });

            // Build calendar cells
            let cells = '';
            const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
            for (let i = 0; i < totalCells; i++) {
                const dayNum = i - firstDay + 1;
                const isValid = dayNum >= 1 && dayNum <= daysInMonth;
                const dateStr = isValid ? `${cy}-${String(cm + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}` : '';
                const isToday = dateStr === todayStr;
                const dayEvents = events[dayNum] || [];
                const hasInstall = dayEvents.some(e => e.color === '#f43f5e' || e.color === '#f97316');
                const hasOwe = dayEvents.some(e => e.color === '#ec4899');
                const hasOwed = dayEvents.some(e => e.color === '#10b981');
                const isPast = isValid && new Date(cy, cm, dayNum) < new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());

                cells += `<div style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;cursor:${isValid ? 'pointer' : 'default'};position:relative;
            background:${isToday ? 'var(--emerald)' : dayEvents.length && isValid ? 'rgba(255,255,255,0.04)' : 'transparent'};
            border:${isToday ? 'none' : dayEvents.length && isValid ? '1px solid rgba(255,255,255,0.08)' : '1px solid transparent'};
            " ${isValid && dayEvents.length ? `onclick="showDebtDayDetail(${dayNum},${cm},${cy})"` : ''}>
            <span style="font-size:12px;font-weight:${isToday || dayEvents.length ? '700' : '400'};color:${isToday ? '#000' : isPast && isValid ? 'rgba(255,255,255,0.3)' : isValid ? 'var(--text)' : 'transparent'};">${isValid ? dayNum : ''}</span>
            ${isValid && dayEvents.length ? `<div style="display:flex;gap:2px;">${hasInstall ? `<div style="width:4px;height:4px;border-radius:50%;background:#f43f5e;"></div>` : ''}${hasOwe ? `<div style="width:4px;height:4px;border-radius:50%;background:#ec4899;"></div>` : ''}${hasOwed ? `<div style="width:4px;height:4px;border-radius:50%;background:#10b981;"></div>` : ''}</div>` : ''}
        </div>`;
            }

            // Monthly total for installments in this month
            const monthInstallTotal = state.debts.installments.filter(d => d.left > 0).reduce((s, d) => {
                const wCurr = (state.wallets.find(w => w.id === d.walletId) || { currency: state.currency.code }).currency;
                return s + convertCurrency(d.amount, wCurr, state.currency.code);
            }, 0);

            const calendarHTML = `
    <div class="card" style="padding:16px;margin-bottom:20px;">
        <!-- header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <button onclick="ui.calendarMonth=${cm === 0 ? 11 : cm - 1};ui.calendarYear=${cm === 0 ? cy - 1 : cy};switchFinanceTab('debts')"

            <div style="display:flex;align-items:center;gap:5px;"><div style="width:7px;height:7px;border-radius:50%;background:#ec4899;"></div><span style="font-size:10px;color:var(--muted);">I Owe</span></div>
            <div style="display:flex;align-items:center;gap:5px;"><div style="width:7px;height:7px;border-radius:50%;background:#10b981;"></div><span style="font-size:10px;color:var(--muted);">Owed to Me</span></div>
        </div>
    </div>`;

            let html = `<div class="fade-up">
        ${calendarHTML}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><p class="section-title" style="margin:0;">Installments <span style="color:var(--rose);">${fmt(totalInstall)}/mo</span></p><button onclick="openDebtForm('installments')" style="color:var(--emerald);"><i data-lucide="plus-circle" style="width:20px;height:20px;"></i></button></div>
        <div style="display:flex;flex-direction:column;gap:10px;">
            ${state.debts.installments.map(item => {

                const paidAmount = item.paidAmount || 0; const totalAmount = item.totalAmount || (item.amount * item.total); const pct = Math.round(paidAmount / totalAmount * 100);
                return `<div class="card" style="padding:16px;"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;"><div style="display:flex;align-items:center;gap:10px;"><div class="icon-box"><i data-lucide="${item.icon || 'credit-card'}" style="width:16px;height:16px;color:var(--muted);"></i></div><div><p style="font-size:14px;font-weight:600;">${item.name}</p><p style="font-size:10px;color:var(--muted);">${wallet.name || 'Wallet'}</p></div></div><button onclick="openDebtForm('installments', ${item.id})" style="color:var(--muted);padding:4px;"><i data-lucide="edit-3" style="width:14px;height:14px;"></i></button></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;"><span class="syne" style="font-size:20px;font-weight:800;">${wCurr} ${fmtNum(item.amount)}<small style="font-size:10px;font-weight:400;color:var(--muted);">/mo</small></span><span style="font-size:11px;color:var(--muted);">${wCurr} ${fmtNum(paidAmount)} / ${fmtNum(totalAmount)}</span></div><div class="progress-bar" style="margin-bottom:6px;"><div class="progress-fill" style="width:${pct}%;"></div></div><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span style="font-size:9px;color:var(--muted);">${pct}% paid · ${item.left} of ${item.total} left</span><span style="font-size:9px;color:var(--emerald);font-weight:700;">${item.dueDate ? 'Due: ' + fmtDate(item.dueDate) : ''}</span></div><div style="display:flex;gap:8px;align-items:center;"><button onclick="payInstallment(${item.id})" style="flex:1;padding:10px;border-radius:12px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);color:var(--emerald);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;"><i data-lucide="check-circle" style="width:14px;height:14px;"></i>Pay ${wCurr} ${fmtNum(item.amount)}</button><button onclick="deleteDebt('installments', ${item.id})" style="width:38px;height:38px;border-radius:12px;background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.15);display:flex;align-items:center;justify-content:center;color:var(--rose);flex-shrink:0;"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button></div></div>`;

        <div style="display:flex;flex-direction:column;gap:10px;">
            ${state.debts.oweTo.map(d => `<div class="card" style="padding:16px;"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;"><div style="display:flex;align-items:center;gap:10px;"><div class="icon-box" style="background:rgba(244,63,94,0.1);"><i data-lucide="arrow-up-right" style="width:16px;height:16px;color:var(--rose);"></i></div><div><p style="font-size:14px;font-weight:600;">${d.name}</p><p style="font-size:10px;color:var(--muted);">${fmtDate(d.date)}</p></div></div><button onclick="openSimpleDebtForm('oweTo', ${d.id})" style="color:var(--muted);padding:4px;"><i data-lucide="edit-3" style="width:14px;height:14px;"></i></button></div><div style="display:flex;justify-content:space-between;align-items:center;"><span class="syne" style="font-size:20px;font-weight:800;">${fmt(d.amount)}</span><button onclick="settleSimpleDebtPrompt('oweTo', ${d.id})" style="padding:8px 16px;border-radius:12px;background:rgba(244,63,94,0.12);color:var(--rose);font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;"><i data-lucide="check-circle" style="width:14px;height:14px;"></i>Settle</button></div></div>`).join('')}

        </div>
        <div style="height:1px; background:var(--border); margin: 30px 0;"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><p class="section-title" style="margin:0;">Someone Owes Me <span style="color:var(--emerald);">${fmt(totalOwed)}</span></p><button onclick="openSimpleDebtForm('owedToMe')" style="color:var(--emerald);"><i data-lucide="plus-circle" style="width:20px;height:20px;"></i></button></div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
            ${state.debts.owedToMe.map(d => `<div class="card" style="padding:16px;"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;"><div style="display:flex;align-items:center;gap:10px;"><div class="icon-box" style="background:rgba(16,185,129,0.1);"><i data-lucide="arrow-down-left" style="width:16px;height:16px;color:var(--emerald);"></i></div><div><p style="font-size:14px;font-weight:600;">${d.name}</p><p style="font-size:10px;color:var(--muted);">${fmtDate(d.date)}</p></div></div><button onclick="openSimpleDebtForm('owedToMe', ${d.id})" style="color:var(--muted);padding:4px;"><i data-lucide="edit-3" style="width:14px;height:14px;"></i></button></div><div style="display:flex;justify-content:space-between;align-items:center;"><span class="syne" style="font-size:20px;font-weight:800;">${fmt(d.amount)}</span><button onclick="settleSimpleDebtPrompt('owedToMe', ${d.id})" style="padding:8px 16px;border-radius:12px;background:rgba(16,185,129,0.12);color:var(--emerald);font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;"><i data-lucide="check-circle" style="width:14px;height:14px;"></i>Receive</button></div></div>`).join('')}
            ${state.debts.owedToMe.length === 0 ? '<p style="text-align:center;font-size:12px;color:var(--muted);padding:10px;">Nobody owes you money.</p>' : ''}
        </div>
    </div>`;
            return html;
        }

        function showDebtDayDetail(day, month, year) {
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            let items = [];

            state.debts.installments.forEach(d => {
                if (d.left <= 0) return;
                const start = new Date(d.startDate || d.date);
                const payDay = start.getDate();
                if (payDay === day) {
                    const wCurr = (state.wallets.find(w => w.id === d.walletId) || { currency: state.currency.code }).currency;
                    items.push({ label: d.name, sub: 'Installment · ' + wCurr + ' ' + fmtNum(d.amount) + '/mo', color: '#f43f5e', icon: d.icon || 'credit-card', action: `payInstallment(${d.id})`, actionLabel: 'Pay Now' });
                }
                if (d.dueDate === dateStr) {
                    items.push({ label: d.name + ' - Final Payment', sub: 'Last installment', color: '#f97316', icon: 'flag', action: `payInstallment(${d.id})`, actionLabel: 'Pay Final' });
                }
            });
            state.debts.oweTo.forEach(d => {
                const dt = d.date;

            if (!cards.length) return;
            const targetId = ui.featuredWalletId || state.wallets[0]?.id;
            ui.walletCarouselCycle = state.wallets.length > 1 ? 2 : 0;
            const targetCard = cards.find(card => parseInt(card.dataset.walletId) === targetId && parseInt(card.dataset.cycle) === ui.walletCarouselCycle) || cards[0];
            ui.walletCarouselJumping = true;
            centerWalletCarouselCard(track, targetCard, 'auto');
            updateWalletCarouselSelection(track, parseInt(targetCard.dataset.walletId), parseInt(targetCard.dataset.cycle));
            setTimeout(() => { ui.walletCarouselJumping = false; }, 60);
        }

        function centerWalletCarouselCard(track, card, behavior = 'smooth') {
            const left = card.offsetLeft - (track.clientWidth - card.clientWidth) / 2;
            track.scrollTo({ left, behavior });
        }

        function scrollWalletCarouselTo(walletId, behavior = 'smooth', cycle = ui.walletCarouselCycle ?? 2) {
            const track = document.getElementById('wallet-card-carousel');
            if (!track) return;
            const cards = Array.from(track.querySelectorAll('.wallet-carousel-item'));
            const card = cards.find(item => parseInt(item.dataset.walletId) === walletId && parseInt(item.dataset.cycle) === cycle)
                || cards.find(item => parseInt(item.dataset.walletId) === walletId);
            if (card) centerWalletCarouselCard(track, card, behavior);
        }

        function moveWalletCarousel(direction) {
            if (!state.wallets.length) return;
            const currentId = ui.featuredWalletId || state.wallets[0].id;
            const currentIndex = Math.max(0, state.wallets.findIndex(w => w.id === currentId));
            const normalizedDirection = direction >= 0 ? 1 : -1;
            let targetCycle = ui.walletCarouselCycle ?? (state.wallets.length > 1 ? 2 : 0);
            let nextIndex = currentIndex + normalizedDirection;
            if (nextIndex >= state.wallets.length) {
                nextIndex = 0;
                targetCycle += 1;
            } else if (nextIndex < 0) {
                nextIndex = state.wallets.length - 1;
                targetCycle -= 1;
            }
            if (targetCycle < 0) targetCycle = 0;
            if (targetCycle > 4) targetCycle = 4;
            const nextWallet = state.wallets[nextIndex];
            if (!nextWallet) return;
            ui.featuredWalletId = nextWallet.id;
            ui.walletCarouselCycle = targetCycle;
            ui.walletGestureLock = true;
            const track = document.getElementById('wallet-card-carousel');
            scrollWalletCarouselTo(nextWallet.id, 'smooth', targetCycle);
            if (track) updateWalletCarouselSelection(track, nextWallet.id, targetCycle);
            setTimeout(() => {
                if (state.wallets.length > 1 && targetCycle !== 2) {
                    ui.walletCarouselCycle = 2;
                    scrollWalletCarouselTo(nextWallet.id, 'auto', 2);
                    if (track) updateWalletCarouselSelection(track, nextWallet.id, 2);
                }
                ui.walletGestureLock = false;
            }, 390);
        }

        function startWalletSwipe(event) {
            ui.walletSwipeStart = { x: event.clientX, y: event.clientY, time: Date.now() };
            ui.walletSwipeMoved = false;
            try { event.currentTarget.setPointerCapture(event.pointerId); } catch {}
        }

        function trackWalletSwipe(event) {
            if (!ui.walletSwipeStart) return;
            const dx = event.clientX - ui.walletSwipeStart.x;
            const dy = event.clientY - ui.walletSwipeStart.y;
            if (Math.hypot(dx, dy) > 10) {
                ui.walletSwipeMoved = true;
                event.preventDefault();
            }
        }

        function cancelWalletSwipe() {
            ui.walletSwipeStart = null;
            setTimeout(() => { ui.walletSwipeMoved = false; }, 0);
        }

        function endWalletSwipe(event) {
            if (!ui.walletSwipeStart) return;
            const dx = event.clientX - ui.walletSwipeStart.x;
            const dy = event.clientY - ui.walletSwipeStart.y;
            const distance = Math.hypot(dx, dy);
            ui.walletSwipeStart = null;
            if (distance < 34) {
                setTimeout(() => { ui.walletSwipeMoved = false; }, 0);
                return;
            }
            const useHorizontal = Math.abs(dx) >= Math.abs(dy);
            let direction = useHorizontal ? (dx < 0 ? 1 : -1) : (dy < 0 ? 1 : -1);
            const currentIndex = state.wallets.findIndex(w => w.id === ui.featuredWalletId);
            if (useHorizontal && dx > 0 && currentIndex === state.wallets.length - 1) direction = 1;
            if (useHorizontal && dx < 0 && currentIndex === 0) direction = 1;
            event.preventDefault();
            moveWalletCarousel(direction);
            setTimeout(() => { ui.walletSwipeMoved = false; }, 220);
        }

        function handleWalletCarouselWheel(event) {
            const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
            if (Math.abs(delta) < 18) return;
            event.preventDefault();
            clearTimeout(ui.walletWheelTimer);
            ui.walletWheelTimer = setTimeout(() => moveWalletCarousel(delta > 0 ? 1 : -1), 20);
        }

        function handleWalletCarouselScroll(track) {
            if (ui.walletGestureLock || ui.walletSwipeStart) return;
            clearTimeout(ui.walletCarouselTimer);
            ui.walletCarouselTimer = setTimeout(() => {
                if (ui.walletGestureLock || ui.walletSwipeStart) return;
                const cards = Array.from(track.querySelectorAll('.wallet-carousel-item'));
                if (!cards.length) return;
                const center = track.scrollLeft + track.clientWidth / 2;
                let nearest = cards[0];
                let nearestDistance = Infinity;
                cards.forEach(card => {
                    const cardCenter = card.offsetLeft + card.clientWidth / 2;
                    const distance = Math.abs(cardCenter - center);
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        nearest = card;
                    }
                });

                updateWalletCarouselSelection(track, parseInt(nearest.dataset.walletId), parseInt(nearest.dataset.cycle));
            }, 80);
        }

        function updateWalletCarouselSelection(track, walletId, cycle = ui.walletCarouselCycle ?? 2) {
            const wallet = state.wallets.find(w => w.id === walletId);
            if (!wallet) return;
            ui.featuredWalletId = walletId;
            ui.walletCarouselCycle = cycle;
            track.querySelectorAll('.wallet-carousel-item').forEach(card => {
                card.classList.toggle('is-active', parseInt(card.dataset.walletId) === walletId && parseInt(card.dataset.cycle) === cycle);

            document.querySelectorAll('.wallet-carousel-dot').forEach((dot, index) => {

            }
            const detailsBtn = document.getElementById('wallet-details-btn');
            if (detailsBtn) detailsBtn.setAttribute('onclick', `openTransactionForm({type:'expense', walletId:${walletId}})`);
            const panelEditBtn = document.getElementById('wallet-panel-edit-btn');
            if (panelEditBtn) panelEditBtn.setAttribute('onclick', `openTransactionForm({type:'expense', walletId:${walletId}})`);
            const transactionsPanel = document.getElementById('wallet-card-transactions');

            if (window.lucide) lucide.createIcons();

                        const type = diff > 0 ? 'income' : 'expense';
                        state.transactions.unshift({ id: genId(), name: 'Wallet Adjustment', categoryId: 'other', type, amount: safeNum(Math.abs(diff)), walletId: w.id, date: nowWithTime(), note: 'Manual balance update' });

        function processTransfer() {
    const fromId = parseInt(document.getElementById('tr-from').value); 
    const toId = parseInt(document.getElementById('tr-to').value);

    const wFrom = state.wallets.find(w => w.id === fromId); 
    const wTo = state.wallets.find(w => w.id === toId);

    // 2. Ø®Ø·ÙˆØ© Ø§Ù„ØªØ­ÙˆÙŠÙ„ Ø§Ù„Ø°ÙƒÙŠ: ØªØ­ÙˆÙŠÙ„ Ø§Ù„Ù…Ø¨Ù„Øº Ø§Ù„Ù…Ø¯Ø®Ù„ Ø¥Ù„Ù‰ Ø§Ù„Ø¬Ù†ÙŠÙ‡ Ø§Ù„Ù…ØµØ±ÙŠ Ø£ÙˆÙ„Ø§Ù‹
    let amountInEGP = amount;
    if (exchangeRates[fromCurr]) {
        amountInEGP = amount * exchangeRates[fromCurr];
    }

    // 3. Ø®Ø·ÙˆØ© Ø§Ù„ØªØ­ÙˆÙŠÙ„ Ø§Ù„Ø«Ø§Ù†ÙŠØ©: ØªØ­ÙˆÙŠÙ„ Ø§Ù„Ù‚ÙŠÙ…Ø© Ø§Ù„Ù…ØµØ±ÙŠØ© Ø¥Ù„Ù‰ Ø¹Ù…Ù„Ø© Ø§Ù„Ù…Ø­ÙØ¸Ø© Ø§Ù„Ù…Ø³ØªÙ‚Ø¨Ù„Ø©
    let convertedAmount = amountInEGP;
    if (exchangeRates[toCurr]) {

        // â”€â”€â”€ SHEET & TOAST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

        function showToast(msg, type = 'success') { const existing = document.querySelector('.toast-el'); if (existing) existing.remove(); const el = document.createElement('div'); el.className = 'toast-el toast-anim'; el.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;font-family:var(--font-main);z-index:1000;pointer-events:none;white-space:nowrap;background:${type === 'error' ? 'var(--rose)' : type === 'warn' ? '#f59e0b' : 'var(--emerald)'};color:#000;`; el.textContent = msg; document.body.appendChild(el); setTimeout(() => { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2200); }

        // â”€â”€â”€ ANALYTICS PAGE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        function renderAnalytics() {
            const now = new Date();
            const thisMonth = now.getMonth();
            const thisYear = now.getFullYear();

            // helper: get month's totals
            function getMonthTotals(m, y) {
                let income = 0, expense = 0;
                state.transactions.forEach(t => {
                    const d = new Date(t.date);
                    if (d.getMonth() !== m || d.getFullYear() !== y) return;
                    if (t.isTransfer || t.excludeFromTotals) return;
                    const w = state.wallets.find(x => x.id === t.walletId) || { currency: state.currency.code };
                    const amt = convertCurrency(t.amount, w.currency, state.currency.code);
                    if (t.type === 'income') income += amt;
                    else expense += amt;
                });
                return { income, expense };
            }

            const { income: monthIn, expense: monthOut } = getMonthTotals(thisMonth, thisYear);
            const savings = monthIn - monthOut;
            const savingsRate = monthIn > 0 ? Math.round((savings / monthIn) * 100) : 0;

            // last 6 months for chart
            const months6 = [];
            for (let i = 5; i >= 0; i--) {
                let m = thisMonth - i; let y = thisYear;
                if (m < 0) { m += 12; y--; }
                const totals = getMonthTotals(m, y);
                months6.push({ label: new Date(y, m, 1).toLocaleDateString('en', { month: 'short' }), ...totals });
            }

            // spending by category this month
            const byCat = {};
            state.transactions.forEach(t => {
                const d = new Date(t.date);
                if (d.getMonth() !== thisMonth || d.getFullYear() !== thisYear) return;
                if (t.type !== 'expense' || t.isTransfer || t.excludeFromTotals) return;
                const w = state.wallets.find(x => x.id === t.walletId) || { currency: state.currency.code };
                const amt = convertCurrency(t.amount, w.currency, state.currency.code);
                byCat[t.categoryId] = (byCat[t.categoryId] || 0) + amt;
            });
            const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const totalCatSpend = catEntries.reduce((s, [, v]) => s + v, 0);

        const GDRIVE_CLIENT_ID = '608503657584-kk54fp09cl297frfnfro32g0m0tp7o5t.apps.googleusercontent.com';
        let gdrive = { connected: false, syncing: false, fileId: localStorage.getItem('velto_gdrive_fileId') || null, autoSyncEnabled: localStorage.getItem('velto_autosync') === 'true' };
        let tokenClient; let accessToken = null;

        function initGoogleDrive() {

                client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',

            });

        function handleTopSyncClick() { if (!accessToken) tokenClient.requestAccessToken(); else if (!gdrive.autoSyncEnabled) performFirstSync(); else { showToast('Syncing to Drive...'); silentAutoSync(); } }
        async function performFirstSync() {
            setSyncingUI(true);
            try { const file = await findDriveFile(); if (file) { await loadFromDrive(file.id); showToast('Data restored from Drive'); } else { await saveToDrive(); showToast('Initial backup saved to Drive'); } gdrive.autoSyncEnabled = true; localStorage.setItem('velto_autosync', 'true'); updateSyncButtonUI(); if (ui.currentTab === 'settings') switchTab('settings'); }
            catch (error) { showToast('Sync failed: ' + error.message, 'error'); } finally { setSyncingUI(false); }
        }
        const originalSaveState = saveState;
        saveState = function () { originalSaveState(); if (gdrive.autoSyncEnabled && accessToken && !gdrive.syncing) silentAutoSync(); };
        let syncTimeout; function silentAutoSync() { clearTimeout(syncTimeout); syncTimeout = setTimeout(async () => { if (gdrive.syncing) return; setSyncingUI(true); try { await saveToDrive(); } catch (e) { console.error('Auto-sync error:', e); } finally { setSyncingUI(false); } }, 2500); }
        async function findDriveFile() { const resp = await fetch('https://www.googleapis.com/drive/v3/files?q=name="velto_backup.json" and trashed=false&spaces=drive', { headers: { 'Authorization': `Bearer ${accessToken}` } }); const data = await resp.json(); if (data.files && data.files.length > 0) { gdrive.fileId = data.files[0].id; localStorage.setItem('velto_gdrive_fileId', gdrive.fileId); return data.files[0]; } return null; }
        async function loadFromDrive(fileId) { const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { 'Authorization': `Bearer ${accessToken}` } }); const data = await resp.json(); if (data && data.wallets) { state = data; originalSaveState(); if (typeof switchTab === 'function') switchTab(ui.currentTab || 'home'); } }
        async function saveToDrive() {
            const metadata = { name: 'velto_backup.json', mimeType: 'application/json' }; const form = new FormData(); form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' })); form.append('file', new Blob([JSON.stringify(state)], { type: 'application/json' }));
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart'; let method = 'POST';
            if (gdrive.fileId) { url = `https://www.googleapis.com/upload/drive/v3/files/${gdrive.fileId}?uploadType=multipart`; method = 'PATCH'; }
            const resp = await fetch(url, { method, headers: { 'Authorization': `Bearer ${accessToken}` }, body: form }); const result = await resp.json(); if (result.id) { gdrive.fileId = result.id; localStorage.setItem('velto_gdrive_fileId', result.id); }
        }
        function setSyncingUI(isSyncing) { gdrive.syncing = isSyncing; const icon = document.getElementById('sync-icon'); if (icon) { if (isSyncing) { icon.classList.add('spin'); icon.style.color = 'var(--emerald)'; } else { icon.classList.remove('spin'); updateSyncButtonUI(); } } }
        function updateSyncButtonUI() { const icon = document.getElementById('sync-icon'); const btn = document.getElementById('top-sync-btn'); if (icon && btn) { if (gdrive.autoSyncEnabled && accessToken) { icon.style.color = 'var(--emerald)'; btn.style.borderColor = 'rgba(16,185,129,0.3)'; } else if (gdrive.autoSyncEnabled && !accessToken) { icon.style.color = '#f59e0b'; btn.style.borderColor = 'rgba(245,158,11,0.3)'; } else { icon.style.color = 'var(--muted)'; btn.style.borderColor = 'var(--border)'; } } }

        // â”€â”€â”€ INIT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        loadState();
        applyTheme();
        window.addEventListener('load', async () => {
            await fetchRates();
            initGoogleDrive();
            switchTab('home');
        });

        // â”€â”€â”€ SWIPE TO CLOSE POPUP (BOTTOM SHEET) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        const bottomSheet = document.getElementById('bottom-sheet');
        let dragStartY = 0;
        let currentDragY = 0;
        let isDraggingSheet = false;

        bottomSheet.addEventListener('touchstart', (e) => {
            // Ù…Ø´ Ù‡Ù†Ø¨Ø¯Ø£ Ø§Ù„Ø³Ø­Ø¨ ØºÙŠØ± Ù„Ùˆ Ø§Ù„Ù…Ø­ØªÙˆÙ‰ Ø¨ØªØ§Ø¹ Ø§Ù„Ù€ popup Ù…Ø¹Ù…ÙˆÙ„Ù‡ Ø³ÙƒØ±ÙˆÙ„ Ù„ÙÙˆÙ‚ Ø®Ø§Ù„Øµ
            if (bottomSheet.scrollTop <= 0) {
                dragStartY = e.touches[0].clientY;
                isDraggingSheet = true;
                // Ø¨Ù†ÙˆÙ‚Ù Ø§Ù„Ù€ Animation Ù…Ø¤Ù‚ØªØ§Ù‹ Ø¹Ø´Ø§Ù† Ø§Ù„Ù€ popup ÙŠØªØ­Ø±Ùƒ Ù…Ø¹ ØµØ¨Ø§Ø¹Ùƒ Ø¨Ø§Ù„Ù…Ù„Ù„ÙŠ
                bottomSheet.style.transition = 'none';
            }
        }, { passive: true });

        bottomSheet.addEventListener('touchmove', (e) => {
            if (!isDraggingSheet) return;

            currentDragY = e.touches[0].clientY;
            const deltaY = currentDragY - dragStartY;

            // Ø¨Ù†Ø³Ù…Ø­ Ø¨Ø§Ù„Ø³Ø­Ø¨ Ù„ØªØ­Øª Ø¨Ø³ (Ù‚ÙŠÙ…Ø© Ù…ÙˆØ¬Ø¨Ø©)
            if (deltaY > 0) {
                // Ø¨Ù†Ù…Ù†Ø¹ Ø§Ù„Ø´Ø§Ø´Ø© Ø§Ù„Ù„ÙŠ ÙˆØ±Ø§ Ø¥Ù†Ù‡Ø§ ØªØªØ­Ø±Ùƒ
                if (e.cancelable) e.preventDefault();
                bottomSheet.style.transform = `translateY(${deltaY}px)`;
            }
        }, { passive: false });

        bottomSheet.addEventListener('touchend', (e) => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;

            // Ø¨Ù†Ø±Ø¬Ø¹ Ø§Ù„Ù€ Animation ØªØ§Ù†ÙŠ Ø¹Ø´Ø§Ù† ÙŠÙ‚ÙÙ„ Ø¨Ù†Ø¹ÙˆÙ…Ø© Ø£Ùˆ ÙŠØ±Ø¬Ø¹ Ù…ÙƒØ§Ù†Ù‡
            bottomSheet.style.transition = 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1)';

            const deltaY = currentDragY - dragStartY;

            // Ù„Ùˆ Ø³Ø­Ø¨ Ù…Ø³Ø§ÙØ© Ø£ÙƒØªØ± Ù…Ù† 120 Ø¨ÙŠÙƒØ³Ù„ØŒ Ø§Ù‚ÙÙ„ Ø§Ù„Ù€ Popup
            if (deltaY > 120) {
                closeSheet();
            }

            // ÙÙŠ ÙƒÙ„ Ø§Ù„Ø­Ø§Ù„Ø§Øª Ø¨Ù†Ø´ÙŠÙ„ Ø§Ù„Ù€ transform Ø§Ù„Ù…ÙƒØªÙˆØ¨ Ø¹Ø´Ø§Ù† Ø§Ù„Ù€ CSS Ø§Ù„Ø£Ø³Ø§Ø³ÙŠ ÙŠØ´ØªØºÙ„
            bottomSheet.style.transform = '';
            currentDragY = 0;
        });

    </script>
    <script>
        // â”€â”€â”€ GLOBAL ERROR BOUNDARY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        window.addEventListener('error', function(e) {
            console.error('Uncaught error:', e.message, e.filename, e.lineno);
            // Don't show UI toast for script load errors (CDN failures etc.)
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.warn('Unhandled promise rejection:', e.reason);
            e.preventDefault(); // suppress console noise for network failures
        });
    </script>
