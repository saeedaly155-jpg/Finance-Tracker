        /* AI FAB & Chat Styles */
        .ai-fab {
            position: absolute; right: 20px; bottom: 124px;
            width: 52px; height: 52px;
            border-radius: 999px;
            background: #0e0e14;
            display: flex; align-items: center; justify-content: center;
            z-index: 15; cursor: pointer;
            font-family: var(--font-main);
            border: none; outline: none;
        }
        .ai-fab::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 999px;
            background: conic-gradient(from var(--angle, 0deg),
                #f97316 0%, #ef4444 15%, #ec4899 30%, #8b5cf6 45%,
                #3b82f6 60%, #06b6d4 75%, #10b981 88%, #f97316 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 1.5px;
            animation: border-rotate 4s linear infinite;
        }
        .ai-fab::after {
            content: '';
            position: absolute;
            inset: -7px;
            border-radius: 999px;
            background: conic-gradient(from var(--angle, 0deg),
                rgba(249,115,22,0.3), rgba(139,92,246,0.25), rgba(59,130,246,0.3), rgba(16,185,129,0.2), rgba(249,115,22,0.3)
            );
            filter: blur(10px);
            animation: border-rotate 4s linear infinite;
            z-index: -1;
        }
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes border-rotate {
            from { --angle: 0deg; }
            to   { --angle: 360deg; }
        }
        .ai-fab:active { transform: scale(0.9); }

<script>
    (function initPWA() {
        const manifest = {
            name: "Finance Pro", short_name: "FinancePro", display: "standalone",
            background_color: "#07070a", theme_color: "#07070a",
            icons: [{ src: "https://cdn-icons-png.flaticon.com/512/3135/3135679.png", sizes: "512x512", type: "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {
                e.respondWith(fetch(e.request).catch(() => new Response('Offline Mode Active', {headers: {'Content-Type': 'text/plain'}})));
            });
        `;
        if ('serviceWorker' in navigator) {
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>console.log("SW bypass"));
        }
    })();
</script>

// ─── HELPERS ─────────────────────────────────────────────────────────
const fmtNum = (n) => Math.abs(n).toLocaleString('en', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmt = (n) => `${state.currency.symbol}${fmtNum(n)}`;
const today = () => new Date().toISOString().split('T')[0];

function convertCurrency(amount, fromCode, toCode) {
    if (fromCode === toCode || !liveRates[fromCode] || !liveRates[toCode]) return amount;
    const inUSD = amount / liveRates[fromCode];
    return inUSD * liveRates[toCode];
}

function getCat(id, type) {
    const all = [...state.categories.expense, ...state.categories.income];
    return all.find(c => c.id === id) || { id: 'other', name: 'Other', icon: 'circle', color: '#52525b' };
}

function dateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const t = new Date(); t.setHours(0,0,0,0);
    const diff = Math.round((t - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
}

function getCurrentMonthSpend(categoryId) {
    const now = new Date();
    const month = now.getMonth(); const year = now.getFullYear();
    return state.transactions.filter(t => {
        const d = new Date(t.date);
        return t.type === 'expense' && t.categoryId === categoryId && d.getMonth() === month && d.getFullYear() === year;
    }).reduce((s, t) => {
        const w = state.wallets.find(x => x.id === t.walletId) || { currency: state.currency.code };
        return s + convertCurrency(t.amount, w.currency, state.currency.code);
    }, 0);
}

function genId() { return Date.now() + Math.floor(Math.random() * 1000); }

function destroyChart(key) {
    if (charts[key]) { try { charts[key].destroy(); } catch(e) {} charts[key] = null; }
}

// ─── WALLET SORTING ───────────────────────────────────────────────────
function getSortedWallets() {
    const wallets = [...state.wallets];
    const sort = state.walletSortOrder || 'custom';
    if (sort === 'balance-desc') {
        wallets.sort((a, b) => {
            const bv = convertCurrency(b.balance, b.currency || state.currency.code, state.currency.code);
            const av = convertCurrency(a.balance, a.currency || state.currency.code, state.currency.code);
            return bv - av;
        });
    } else if (sort === 'balance-asc') {
        wallets.sort((a, b) => {
            const av = convertCurrency(a.balance, a.currency || state.currency.code, state.currency.code);
            const bv = convertCurrency(b.balance, b.currency || state.currency.code, state.currency.code);
            return av - bv;
        });
    } else if (sort === 'name-asc') {
        wallets.sort((a, b) => a.name.localeCompare(b.name));
    }
    return wallets;
}

let dragSrcIndex = null;
function dragStart(e, idx) { dragSrcIndex = idx; e.target.classList.add('dragging'); }
function dragOver(e) { e.preventDefault(); }
function dragDrop(e, targetIdx) {
    e.preventDefault();
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    if (dragSrcIndex === null || dragSrcIndex === targetIdx) return;
    const moved = state.wallets.splice(dragSrcIndex, 1)[0];
    state.wallets.splice(targetIdx, 0, moved);
    dragSrcIndex = null;
    saveState();
    openSortSheet();
}

function applySortOrder(key) {
    state.walletSortOrder = key;

    closeSheet();
    switchTab('wallets');
}

function switchTab(tabId) {
    // 1. منطق ذكي لتوجيه التبويبات الفرعية للـ Finance
    const isFinanceTab = ['income', 'budgets', 'debts'].includes(tabId);
    const target = isFinanceTab ? 'finance' : tabId;

    // 2. تحديث الـ Active class
    document.querySelectorAll('.nav-icon-btn').forEach(btn => {
        btn.classList.remove('nav-active');
        btn.style.strokeWidth = "2";
    });

   const activeBtn = document.querySelector(`[onclick*="switchTab('${target}')"]`);
   if (activeBtn) {
        activeBtn.classList.add('nav-active');
        activeBtn.style.strokeWidth = "3";
    } else if (tabId === 'settings') {
        // البحث البديل في حال لم يجد الرابط
        const settingsBtn = document.querySelector('[onclick*="switchTab(\'settings\')"]');
        if (settingsBtn) {
            settingsBtn.classList.add('nav-active');
            settingsBtn.style.strokeWidth = "3";
        }
    }

    // 3. التحديث المرئي والمحتوى
    const main = document.getElementById('main-content');
    const title = document.getElementById('header-title');
    
    main.style.opacity = '0';
    Object.keys(charts).forEach(k => destroyChart(k));
    
    setTimeout(() => {
        const titles = { 
            home: 'Dashboard', 
            finance: 'Finance', 
            wallets: 'Wallets', 
            settings: 'Settings' 
        };
        title.textContent = titles[tabId] || 'Dashboard';
        
        const renders = { 
            home: renderHome, 
            finance: renderFinance, 
            wallets: renderWallets, 
            settings: renderSettings 
        };
        
        // استخدام الـ render المناسب أو العودة للـ Home
        main.innerHTML = (renders[tabId] || renderHome)();
        
        lucide.createIcons();
        if (tabId === 'home') initCharts();
        updateHeaderAvatar();
        main.style.opacity = '1';
    }, 160);
}

function openAIChat() {
    // التحقق من وجود المفتاح في localStorage وليس كمتغير ثابت

    if (!apiKey) {

            <button onclick="sendChatMessage()" style="width:52px; height:52px; border-radius:18px; background:linear-gradient(135deg,#f97316,#ef4444 50%,#8b5cf6); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow: 0 0 14px 3px rgba(239,68,68,0.4);">
                <i data-lucide="send" style="width:20px; height:20px;"></i>

        </div>
    `;
    openSheet();
    lucide.createIcons();
    setTimeout(() => document.getElementById('chat-input').focus(), 100);
    const chatContainer = document.getElementById('chat-messages');
    chatHistory.forEach(msg => {
        chatContainer.innerHTML += `<div class="chat-bubble ${msg.role === 'user' ? 'chat-user' : 'chat-bot'}">${msg.text}</div>`;
    });

}

async function sendChatMessage() {
    const apiKey = localStorage.getItem('velto_gemini_key');
    const inputEl = document.getElementById('chat-input');
    const text = inputEl ? inputEl.value.trim() : '';
    if (!text) return;
    const chatContainer = document.getElementById('chat-messages');
    chatContainer.innerHTML += `<div class="chat-bubble chat-user">${text}</div>`;
    chatHistory.push({role: 'user', text});
    inputEl.value = '';
    chatContainer.scrollTop = chatContainer.scrollHeight;
    const loadingId = 'loading-' + Date.now();
    chatContainer.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-bot" style="display:flex; gap:6px; align-items:center;"><div class="sync-status-dot syncing" style="background:#8b5cf6;"></div> Thinking...</div>`;
    chatContainer.scrollTop = chatContainer.scrollHeight;
    if (!apiKey) {
        document.getElementById(loadingId)?.remove();
        chatContainer.innerHTML += `<div class="chat-bubble chat-bot" style="color:var(--amber);">برجاء إدخال الـ Gemini API Key في الإعدادات أولاً 🔑</div>`;
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return;
    }
    try {
        const aiState = {
            currentDate: today(), baseCurrency: state.currency.code,
            wallets: state.wallets.map(({id, name, balance, currency}) => ({id, name, balance, currency})),
            categories: { expense: state.categories.expense.map(({id, name}) => ({id, name})), income: state.categories.income.map(({id, name}) => ({id, name})) },
            transactions: state.transactions.map(({id, name, amount, type, categoryId, walletId, date}) => ({id, name, amount, type, categoryId, walletId, date})),
            budgets: state.budgets.map(b => { const catName = getCat(b.categoryId).name; return { category: catName, limit: b.limit, currentlySpent: getCurrentMonthSpend(b.categoryId) }; }),
            goals: state.goals.map(({name, target, saved, deadline}) => ({name, target, saved, deadline})),
        };
        const sysPrompt = `You are a highly intelligent financial assistant embedded in a user's local finance app. Speak in friendly Egyptian Arabic. Be concise and helpful.\n\nUser finances:\n${JSON.stringify(aiState)}\n\nIf adding a transaction, output JSON:\n\`\`\`json\n{"execute":true,"transaction":{"name":"...","amount":100,"type":"expense","categoryId":"food","walletId":1},"message":"تم ✅"}\n\`\`\``;
        const reqBody = {
            systemInstruction: { parts: [{ text: sysPrompt }] },
            contents: [ ...chatHistory.slice(0, -1).map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] })), { role: 'user', parts: [{ text }] } ]
        };
        const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(reqBody) });
        if (!response.ok) { const errData = await response.json(); throw new Error(errData.error?.message || `HTTP Error ${response.status}`); }
        const data = await response.json();
        let botText = data.candidates[0].content.parts[0].text;
        document.getElementById(loadingId).remove();
        const jsonMatch = botText.match(/`{3}json\s*([\s\S]*?)\s*`{3}/);
        if (jsonMatch) {
            try {
                const action = JSON.parse(jsonMatch[1]);
                if (action.execute && action.transaction) { executeAITransaction(action.transaction); botText = action.message || 'تمت الإضافة ✅'; }
            } catch(e) { botText = 'فهمت إنك عايز تسجل معاملة، بس في حاجة غلط. ممكن توضح تاني؟'; }
        }
        botText = botText.replace(/`{3}json\s*([\s\S]*?)\s*`{3}/, '').trim();
        chatContainer.innerHTML += `<div class="chat-bubble chat-bot">${botText.replace(/\n/g, '<br>')}</div>`;
        chatHistory.push({role: 'bot', text: botText});
        chatContainer.scrollTop = chatContainer.scrollHeight;
        lucide.createIcons();
    } catch (err) {
        document.getElementById(loadingId)?.remove();
        chatContainer.innerHTML += `<div class="chat-bubble chat-bot" style="color:var(--rose);">حصلت مشكلة: ${err.message}</div>`;
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
}

function executeAITransaction(txData) {
    const wallet = state.wallets.find(w => w.id === txData.walletId) || state.wallets[0];
    let catArray = state.categories[txData.type] || state.categories['expense'];
    const cat = catArray.find(c => c.id === txData.categoryId) || catArray[0];
    const tx = { id: genId(), name: txData.name, categoryId: cat.id, type: txData.type, amount: txData.amount, walletId: wallet.id, date: today(), note: 'Added via Smart Assistant' };
    state.transactions.unshift(tx);
    wallet.balance += txData.type === 'expense' ? -txData.amount : txData.amount;
    saveState();
    if (ui.currentTab === 'home') { document.getElementById('main-content').innerHTML = renderHome(); initCharts(); }
    else if (ui.currentTab === 'wallets') { document.getElementById('main-content').innerHTML = renderWallets(); }
}

function handleSearch() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const resDiv = document.getElementById('search-results');
    if (!query) { resDiv.innerHTML = '<p style="text-align:center;color:var(--muted);padding:30px;font-size:13px;">Find anywhere in the app...</p>'; return; }
    let html = '';
    const wallets = state.wallets.filter(w => w.name.toLowerCase().includes(query) || (w.currency && w.currency.toLowerCase().includes(query)));
    if (wallets.length) { html += '<p class="section-title" style="margin-top:10px;">Wallets</p>'; html += wallets.map(w => `<div class="tx-row" onclick="closeSheet(); switchTab('wallets');"><div class="icon-box" style="background:rgba(255,255,255,0.05);"><i data-lucide="${w.icon}" style="color:var(--muted);"></i></div><div style="flex:1;"><p style="font-size:14px;font-weight:600;">${w.name}</p><p style="font-size:10px;color:var(--muted);">${w.currency||state.currency.code} ${fmtNum(w.balance)}</p></div></div>`).join(''); }
    const goals = state.goals.filter(g => g.name.toLowerCase().includes(query));
    if (goals.length) { html += '<p class="section-title" style="margin-top:10px;">Goals</p>'; html += goals.map(g => `<div class="tx-row" onclick="openGoalForm(${g.id})"><div class="icon-box" style="background:${g.color}18;"><i data-lucide="${g.icon}" style="color:${g.color};"></i></div><div style="flex:1;"><p style="font-size:14px;font-weight:600;">${g.name}</p><p style="font-size:10px;color:var(--muted);">${fmt(g.saved)} / ${fmt(g.target)}</p></div></div>`).join(''); }
    const txs = state.transactions.filter(t => { const cat = getCat(t.categoryId); return t.name.toLowerCase().includes(query) || (t.note && t.note.toLowerCase().includes(query)) || cat.name.toLowerCase().includes(query); });
    if (txs.length) {
        html += '<p class="section-title" style="margin-top:10px;">Transactions</p>';
        html += txs.map(t => { const cat = getCat(t.categoryId); const wallet = state.wallets.find(w => w.id === t.walletId) || {}; const wCurr = wallet.currency || state.currency.code; return `<div class="tx-row" onclick="openEditTransaction(${t.id})"><div class="icon-box" style="background:${cat.color}18;"><i data-lucide="${cat.icon}" style="width:18px;height:18px;color:${cat.color};"></i></div><div style="flex:1;min-width:0;"><p style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.name}</p><p style="font-size:10px;color:var(--muted);">${cat.name} · ${dateLabel(t.date)}</p></div><div style="text-align:right;"><p class="syne" style="font-size:14px;font-weight:700;color:${t.type === 'expense' ? 'var(--rose)' : 'var(--emerald)'};">${t.type==='expense'?'-':'+'} ${wCurr} ${fmtNum(t.amount)}</p></div></div>`; }).join('');
    }
    if (!html) { resDiv.innerHTML = '<p style="text-align:center;color:var(--muted);padding:30px;font-size:13px;">No results found</p>'; return; }
    resDiv.innerHTML = html;
    lucide.createIcons();
}

    const active = document.getElementById(`period-${p}`);
    if (active) { active.style.background = 'var(--surface2)'; active.style.color = 'var(--text)'; }
    destroyChart('cashFlow');
    initCashFlowChart();
}

function initCashFlowChart() {
    const canvas = document.getElementById('cashFlowChart');
    if (!canvas) return;
    const days = ui.chartPeriod === '7d' ? 7 : ui.chartPeriod === '30d' ? 30 : 90;
    const labels = [], incomes = [], expenses = [];
    for (let i = days - 1; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        const label = days <= 7 ? d.toLocaleDateString('en', { weekday: 'short' }) : d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
        labels.push(label);
        const dayTx = state.transactions.filter(t => t.date === ds);
        incomes.push(dayTx.filter(t => t.type === 'income').reduce((s, t) => s + convertCurrency(t.amount, (state.wallets.find(w=>w.id===t.walletId)||{}).currency, state.currency.code), 0));
        expenses.push(dayTx.filter(t => t.type === 'expense').reduce((s, t) => s + convertCurrency(t.amount, (state.wallets.find(w=>w.id===t.walletId)||{}).currency, state.currency.code), 0));
    }
    destroyChart('cashFlow');
    const ctx = canvas.getContext('2d');

    // Emerald neon gradient fill
    const emeraldGrad = ctx.createLinearGradient(0, 0, 0, 180);
    emeraldGrad.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
    emeraldGrad.addColorStop(0.5, 'rgba(16, 185, 129, 0.08)');
    emeraldGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');

    // Rose gradient fill
    const roseGrad = ctx.createLinearGradient(0, 0, 0, 180);
    roseGrad.addColorStop(0, 'rgba(244, 63, 94, 0.28)');
    roseGrad.addColorStop(0.5, 'rgba(244, 63, 94, 0.06)');
    roseGrad.addColorStop(1, 'rgba(244, 63, 94, 0)');

    charts['cashFlow'] = new Chart(canvas, {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    label: 'Income',
                    data: incomes,
                    borderColor: '#10b981',
                    borderWidth: 2.5,
                    backgroundColor: emeraldGrad,
                    fill: true,
                    tension: 0.45,
                    pointRadius: (ctx) => ctx.dataIndex === incomes.length - 1 ? 5 : 0,
                    pointBackgroundColor: '#10b981',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    shadowBlur: 20,
                    shadowColor: 'rgba(16,185,129,0.8)',
                },
                {
                    label: 'Expense',
                    data: expenses,
                    borderColor: '#f43f5e',
                    borderWidth: 2,
                    backgroundColor: roseGrad,
                    fill: true,
                    tension: 0.45,
                    pointRadius: (ctx) => ctx.dataIndex === expenses.length - 1 ? 5 : 0,
                    pointBackgroundColor: '#f43f5e',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                }
            ]
        },
        plugins: [{
            id: 'glowLine',
            beforeDatasetDraw(chart, args) {
                const { ctx } = chart;
                if (args.index === 0) {
                    ctx.save();
                    ctx.shadowBlur = 16;
                    ctx.shadowColor = 'rgba(16, 185, 129, 0.75)';
                } else {
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(244, 63, 94, 0.5)';
                }
            },
            afterDatasetDraw(chart) {
                chart.ctx.restore();
            }
        }],
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(15,15,20,0.92)',
                    borderColor: 'rgba(255,255,255,0.08)',
                    borderWidth: 1,
                    titleColor: '#a1a1aa',
                    bodyColor: '#f4f4f5',
                    padding: 10,
                    callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw)}` }
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { color: '#52525b', font: { size: 9, family: 'Google Sans Flex' } } },
                y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#52525b', font: { size: 9, family: 'Google Sans Flex' }, callback: v => fmt(v) }, beginAtZero: true }
            }
        }
    });
}

function initDonutChart() {
    const canvas = document.getElementById('donutChart');
    if (!canvas) return;
    const now = new Date(); const month = now.getMonth(); const year = now.getFullYear();
    const byCat = {};
    state.transactions.filter(t => { const d = new Date(t.date); return t.type === 'expense' && d.getMonth() === month && d.getFullYear() === year; }).forEach(t => { const w = state.wallets.find(x => x.id === t.walletId) || {}; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + convertCurrency(t.amount, w.currency, state.currency.code); });
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (!entries.length) return;
    destroyChart('donut');
    charts['donut'] = new Chart(canvas, {
        type: 'doughnut',
        data: { labels: entries.map(([id]) => getCat(id).name), datasets: [{ data: entries.map(([, v]) => v), backgroundColor: entries.map(([id]) => getCat(id).color), borderWidth: 0, hoverOffset: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } } } }
    });
}

function openBudgetForm() {
    const catOpts = state.categories.expense.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('sheet-content').innerHTML = `<h2 class="syne" style="font-size:20px;font-weight:800;margin-bottom:20px;">Set Budget</h2><div style="display:flex;flex-direction:column;gap:12px;"><select id="b-cat" class="input">${catOpts}</select><input type="number" id="b-limit" class="input" placeholder="Monthly limit (${state.currency.code})" inputmode="decimal"><button onclick="saveBudget()" class="btn-primary">Save Budget</button></div>`;
    openSheet();
}
function saveBudget() {
    const categoryId = document.getElementById('b-cat').value; const limit = parseFloat(document.getElementById('b-limit').value);
    if (!limit) return showToast('Enter limit'); const existing = state.budgets.findIndex(b => b.categoryId === categoryId);
    if (existing >= 0) state.budgets[existing].limit = limit; else state.budgets.push({ id: genId(), categoryId, limit, period: 'monthly' });
    saveState(); closeSheet(); switchFinanceTab('budgets'); showToast('Budget saved!');
}
function deleteBudget(id) { state.budgets = state.budgets.filter(b => b.id !== id); saveState(); switchFinanceTab('budgets'); showToast('Budget removed'); }

    const icons = ['shield','car','plane','home','laptop','graduation-cap','heart','umbrella','gamepad-2'];

            <input type="number" id="g-saved" class="input" placeholder="Already saved (optional)" value="${g?.saved||''}" inputmode="decimal">

                <button onclick="saveGoal(${g?.id||'null'})" class="btn-primary">${g ? 'Save' : 'Create Goal'}</button>
            </div>

}

function saveGoal(editId) {
    const name = document.getElementById('g-name').value.trim();
    const target = parseFloat(document.getElementById('g-target').value);
    const saved = parseFloat(document.getElementById('g-saved').value) || 0;
    if (!name || !target) return showToast('Fill required fields');
    const item = { name, target, saved, deadline: document.getElementById('g-date').value, icon: document.getElementById('g-icon').value, color: '#3b82f6' };
    if (editId) { const idx = state.goals.findIndex(g => g.id === editId); if (idx >= 0) state.goals[idx] = { ...state.goals[idx], ...item }; } else { item.id = genId(); state.goals.push(item); }
    saveState(); closeSheet(); switchFinanceTab('budgets'); showToast(editId ? 'Goal Updated' : 'Goal Created');
}
function deleteGoal(id) { state.goals = state.goals.filter(g => g.id !== id); saveState(); closeSheet(); switchFinanceTab('budgets'); showToast('Goal removed'); }

function fundGoalPrompt(goalId) {
    const g = state.goals.find(x => x.id === goalId); if(!g) return;
    document.getElementById('sheet-content').innerHTML = `
        <h2 class="syne" style="font-size:20px;font-weight:800;margin-bottom:6px;">Fund "${g.name}"</h2>
        <p style="font-size:12px;color:var(--muted);margin-bottom:20px;">Move money from a wallet into your goal.</p>
        <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:20px 0;">
                <span class="syne" style="font-size:36px;font-weight:800;color:${g.color};">+</span>
                <input type="number" id="fg-amount" class="input" placeholder="0" style="font-size:36px;font-weight:800;text-align:center;width:160px;border:none;background:transparent;padding:0;color:${g.color};" inputmode="decimal">
            </div>
            <div><p class="section-title">From Wallet</p><select id="fg-wallet" class="input">${state.wallets.map(w => `<option value="${w.id}">${w.name} (${w.currency||state.currency.code} ${fmtNum(w.balance)})</option>`).join('')}</select></div>
            <button onclick="processGoalFunding(${g.id})" class="btn-primary" style="background:${g.color};color:#fff;margin-top:10px;">Transfer Funds</button>
        </div>`;
    openSheet();
}

function processGoalFunding(goalId) {
    const g = state.goals.find(x => x.id === goalId);
    const amount = parseFloat(document.getElementById('fg-amount').value);
    const walletId = parseInt(document.getElementById('fg-wallet').value);
    if (!amount || amount <= 0) return showToast('Invalid amount', 'error');
    const wallet = state.wallets.find(w => w.id === walletId);
    if (!wallet) return showToast('Wallet error', 'error');
    if (wallet.balance < amount) return showToast('Insufficient funds', 'error');
    wallet.balance -= amount;
    const wCurr = wallet.currency || state.currency.code;
    const addedToBase = convertCurrency(amount, wCurr, state.currency.code);
    g.saved += addedToBase;
    const catId = state.categories.expense.find(c => c.id === 'savings')?.id || 'other';
    state.transactions.unshift({ id: genId(), name: `Goal: ${g.name}`, categoryId: catId, type: 'expense', amount, walletId: wallet.id, date: today(), note: 'Transferred to Savings Goal' });
    saveState(); closeSheet(); switchFinanceTab('budgets'); showToast(`Added ${fmt(addedToBase)} to goal!`);
}

function updateTxCurrencyLabel() { const w = state.wallets.find(x => x.id === ui.selectedWalletId); const lbl = document.getElementById('tx-currency-label'); if(lbl && w) lbl.textContent = w.currency || state.currency.code; }
function openEditTransaction(id) { const tx = state.transactions.find(t => t.id === id); if (tx) openTransactionForm(tx); }
function setType(type) {
    ui.selectedType = type;
    const sign = document.getElementById('sign-label'); const btnE = document.getElementById('btn-expense'); const btnI = document.getElementById('btn-income');
    if (type === 'expense') { btnE.style.cssText = 'background:var(--rose);color:#fff;'; btnI.style.cssText = 'color:var(--muted);background:none;'; sign.style.color = 'var(--rose)'; sign.textContent = '-'; }
    else { btnI.style.cssText = 'background:var(--emerald);color:#000;'; btnE.style.cssText = 'color:var(--muted);background:none;'; sign.style.color = 'var(--emerald)'; sign.textContent = '+'; }
    ui.selectedCategoryId = state.categories[type][0]?.id; renderCatGrid();
}
function renderWalletChips() { const container = document.getElementById('wallet-chips'); if (!container) return; container.innerHTML = state.wallets.map(w => `<button onclick="selectWallet(${w.id})" style="${ui.selectedWalletId===w.id ? 'border-color:var(--emerald);background:rgba(16,185,129,0.1);color:var(--emerald);' : ''}" class="wallet-chip">${w.name}</button>`).join(''); }
function selectWallet(id) { ui.selectedWalletId = id; renderWalletChips(); updateTxCurrencyLabel(); }
function renderCatGrid() {

}
function saveSimpleDebt(type, editId) {
    const name = document.getElementById('sd-name').value.trim(); const amount = parseFloat(document.getElementById('sd-amount').value); const date = document.getElementById('sd-date').value || today();
    if(!name || !amount) return showToast('Fill all fields');
    const item = { name, amount, date };
    if (editId) { const idx = state.debts[type].findIndex(d => d.id === editId); if (idx >= 0) state.debts[type][idx] = { ...state.debts[type][idx], ...item }; } else { item.id = genId(); state.debts[type].push(item); }
    saveState(); closeSheet(); switchFinanceTab('debts'); showToast(editId ? 'Updated!' : 'Added!');
}
function settleSimpleDebtPrompt(type, id) {
    const item = state.debts[type].find(d => d.id === id); if(!item) return; const isOwe = type === 'oweTo';
    document.getElementById('sheet-content').innerHTML = `<h2 class="syne" style="font-size:20px;font-weight:800;margin-bottom:6px;">Settle: ${item.name}</h2><p style="font-size:12px;color:var(--muted);margin-bottom:20px;">Amount: ${fmt(item.amount)}</p><div style="display:flex;flex-direction:column;gap:12px;"><div><p class="section-title">Select Wallet to ${isOwe ? 'Pay From' : 'Receive Into'}</p><select id="settle-wallet" class="input">${state.wallets.map(w => `<option value="${w.id}">${w.name} (${w.currency||state.currency.code} ${fmtNum(w.balance)})</option>`).join('')}</select></div><button onclick="processSettleDebt('${type}', ${id})" class="btn-primary" style="background:${isOwe?'var(--rose)':'var(--emerald)'};color:${isOwe?'#fff':'#000'};">Confirm Settlement</button></div>`;
    openSheet();
}
function processSettleDebt(type, id) {
    const item = state.debts[type].find(d => d.id === id);
    if (!item) return;

    const isOwe = (type === 'oweTo');
    const walletId = parseInt(document.getElementById('settle-wallet').value);
    const wallet = state.wallets.find(w => w.id === walletId);
    
    if (!wallet) {
        showToast('Wallet error', 'error');
        return;
    }

    const wCurr = wallet.currency || state.currency.code;
    const convAmount = convertCurrency(item.amount, state.currency.code, wCurr);

    console.log(`Processing debt: ${type}, Amount: ${convAmount}, Current Balance: ${wallet.balance}`);

    if (isOwe) {
        // Paying a debt: Should be subtracted
        wallet.balance -= convAmount;
        state.transactions.unshift({
            id: genId(),
            name: `Settled Debt: ${item.name}`,

function saveDebt(type, editId) {
    const name = document.getElementById('d-name').value.trim(); const amount = parseFloat(document.getElementById('d-amount').value); const total = parseInt(document.getElementById('d-total').value);
    if (!name || !amount || !total) return showToast('Fill all required fields');
    const startDate = document.getElementById('d-start-date').value || today(); const dueDate = document.getElementById('d-due-date').value;
    const totalAmount = amount * total; let left = total; let paidAmount = 0;
    if (editId) { const existing = state.debts.installments.find(d => d.id === editId); if (existing) { left = existing.left !== undefined ? existing.left : total; paidAmount = existing.paidAmount || 0; } }
    const item = { name, amount, total, totalAmount, startDate, dueDate, date: startDate, left, paidAmount, walletId: parseInt(document.getElementById('d-wallet').value), icon: document.getElementById('d-icon').value };
    if (editId) { const idx = state.debts[type].findIndex(d => d.id === editId); if (idx >= 0) state.debts[type][idx] = { ...state.debts[type][idx], ...item }; } else { item.id = genId(); state.debts[type].push(item); }

}
function payInstallment(id) {
    const item = state.debts.installments.find(d => d.id === id); if (!item) return; if (item.left <= 0) return showToast('Already fully paid!', 'warn');
    const wallet = state.wallets.find(w => w.id === item.walletId); if (!wallet) return showToast('Wallet not found', 'error'); if (wallet.balance < item.amount) return showToast('Insufficient balance', 'error');
    wallet.balance -= item.amount; item.paidAmount = parseFloat(((item.paidAmount || 0) + item.amount).toFixed(2)); item.left = Math.max(0, item.left - 1);
    state.transactions.unshift({ id: genId(), name: `Payment: ${item.name}`, categoryId: 'bills', type: 'expense', amount: item.amount, walletId: item.walletId, date: today(), note: `Installment (${item.total - item.left}/${item.total})` });
    if (item.left === 0) { state.debts.installments = state.debts.installments.filter(d => d.id !== id); saveState(); switchFinanceTab('debts'); return showToast(`${item.name} fully paid! 🎉`); }
    saveState(); switchFinanceTab('debts'); showToast(`Paid! ${item.left} months left`);
}

function saveWallet(editId) {
    const id = editId ? parseInt(editId) : null;

function processTransfer() {
    const fromId = parseInt(document.getElementById('tr-from').value); const toId = parseInt(document.getElementById('tr-to').value); const amount = parseFloat(document.getElementById('tr-amount').value);
    if (fromId === toId) return showToast('Please select different wallets', 'error'); if (!amount || amount <= 0) return showToast('Enter a valid amount', 'error');
    const wFrom = state.wallets.find(w => w.id === fromId); const wTo = state.wallets.find(w => w.id === toId);
    if (wFrom.balance < amount) return showToast('Insufficient balance', 'error');
    const fromCurr = wFrom.currency || state.currency.code; const toCurr = wTo.currency || state.currency.code; const convertedAmount = convertCurrency(amount, fromCurr, toCurr);
    wFrom.balance -= amount; wTo.balance += convertedAmount;
    const dateStr = today();
    state.transactions.unshift({ id: genId(), name: `Transfer to ${wTo.name}`, categoryId: 'other', type: 'expense', amount, walletId: wFrom.id, date: dateStr, note: 'Internal Transfer Out' });
    state.transactions.unshift({ id: genId() + 1, name: `Transfer from ${wFrom.name}`, categoryId: 'other', type: 'income', amount: convertedAmount, walletId: wTo.id, date: dateStr, note: 'Internal Transfer In' });
    saveState(); closeSheet(); switchTab('wallets'); showToast('Transfer Successful! 💸');
}

            <div class="card" style="padding:12px;text-align:center;"><p class="syne" style="font-size:18px;font-weight:800;color:var(--emerald);">${state.budgets.length}</p><p style="font-size:9px;color:var(--muted);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Budgets</p></div>
        </div>

        ${milestonesHTML}

        <div class="card ${gd.connected ? 'gdrive-connected' : ''}" style="padding:0;overflow:hidden;margin-bottom:8px;border-color:${gd.connected ? 'rgba(16,185,129,0.25)' : 'var(--border)'};">
            <div style="padding:16px;display:flex;align-items:center;gap:12px;"><div style="width:36px;height:36px;border-radius:11px;background:rgba(66,133,244,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 27h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg></div><div style="flex:1;min-width:0;"><p style="font-size:14px;font-weight:700;">Google Drive Sync</p><div style="display:flex;align-items:center;gap:6px;margin-top:2px;"><span class="sync-status-dot ${dotClass}"></span><p style="font-size:11px;color:${driveStatusColor};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${driveStatusText}</p></div></div></div>
            ${gd.autoSyncEnabled ? `<div style="padding:10px 16px;background:rgba(16,185,129,0.04);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);"><span style="font-size:10px;color:var(--muted);">All changes save automatically</span><button onclick="handleTopSyncClick()" style="font-size:10px;font-weight:700;color:var(--emerald);">Force Sync</button></div>` : `<div style="padding:10px 16px;background:rgba(245,158,11,0.04);border-top:1px solid var(--border);"><p style="font-size:10px;color:#f59e0b;">Tap the Sync Icon at the top to enable</p></div>`}
        </div>
        
        <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="card" style="overflow:hidden;">
                <button onclick="openProfileEdit()" style="width:100%;padding:16px;display:flex;align-items:center;gap:12px;text-align:left;border-bottom:1px solid var(--border);"><div style="width:36px;height:36px;border-radius:11px;background:rgba(16,185,129,0.1);display:flex;align-items:center;justify-content:center;"><i data-lucide="user" style="width:16px;height:16px;color:var(--emerald);"></i></div><div style="flex:1;"><p style="font-size:14px;font-weight:600;">Edit Profile</p><p style="font-size:11px;color:var(--muted);">Name, email</p></div><i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted);"></i></button>
                <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;"><div style="display:flex;align-items:center;gap:12px;"><div style="width:36px;height:36px;border-radius:11px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;"><i data-lucide="dollar-sign" style="width:16px;height:16px;color:#3b82f6;"></i></div><div><p style="font-size:14px;font-weight:600;">Main Currency</p><p style="font-size:11px;color:var(--muted);">${state.currency.name||state.currency.code}</p></div></div><select onchange="setCurrency(this.value)" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 10px;color:var(--text);font-size:12px;font-weight:700;outline:none;">${SUPPORTED_CURRENCIES.map(c => `<option value="${c.code}" ${state.currency.code===c.code?'selected':''}>${c.code} ${c.symbol}</option>`).join('')}</select></div>
            </div>
            <div class="card" style="overflow:hidden;">
                <button onclick="exportData()" style="width:100%;padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);"><div style="width:36px;height:36px;border-radius:11px;background:rgba(16,185,129,0.1);display:flex;align-items:center;justify-content:center;"><i data-lucide="download" style="width:16px;height:16px;color:var(--emerald);"></i></div><div style="flex:1;text-align:left;"><p style="font-size:14px;font-weight:600;">Export Data</p><p style="font-size:11px;color:var(--muted);">Download as JSON</p></div><i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted);"></i></button>
                <button onclick="importDataPrompt()" style="width:100%;padding:16px;display:flex;align-items:center;gap:12px;"><div style="width:36px;height:36px;border-radius:11px;background:rgba(245,158,11,0.1);display:flex;align-items:center;justify-content:center;"><i data-lucide="upload" style="width:16px;height:16px;color:#f59e0b;"></i></div><div style="flex:1;text-align:left;"><p style="font-size:14px;font-weight:600;">Import Data</p><p style="font-size:11px;color:var(--muted);">Restore from JSON</p></div><i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted);"></i></button>
            </div>
            <button onclick="confirmReset()" style="padding:16px;border-radius:16px;background:rgba(244,63,94,0.06);border:1px solid rgba(244,63,94,0.15);width:100%;color:var(--rose);font-size:14px;font-weight:700;">Reset All Data</button>
        </div>
    </div>`;
}
 
function generateMilestoneTrack(title, pct, color, subtitle) {
    const m25 = pct >= 25 ? color : 'rgba(255,255,255,0.06)';
    const m50 = pct >= 50 ? color : 'rgba(255,255,255,0.06)';
    const m75 = pct >= 75 ? color : 'rgba(255,255,255,0.06)';
    const m100 = pct >= 100 ? color : 'rgba(255,255,255,0.06)';
    
    return `
    <div style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
            <div>
                <p style="font-size:13px; font-weight:700; color:var(--text);">${title}</p>
                <p style="font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;">${subtitle}</p>
            </div>
            <span class="syne" style="font-size:14px; font-weight:800; color:${color};">${pct}%</span>
        </div>
        <div style="position:relative; height:12px; display:flex; align-items:center;">
            <div style="position:absolute; width:100%; height:4px; background:rgba(255,255,255,0.04); border-radius:4px; z-index:1;"></div>
            <div style="position:absolute; width:${pct}%; height:4px; background:linear-gradient(90deg, ${color}66, ${color}); border-radius:4px; z-index:2; transition: width 0.8s ease;"></div>
            <div style="width:100%; display:flex; justify-content:space-between; position:relative; z-index:3;">
                <div style="width:12px; height:12px; border-radius:50%; background:${m25}; border:2px solid var(--surface2); box-shadow:0 0 8px ${pct>=25?color+'66':'transparent'}; transition:all 0.3s;"></div>
                <div style="width:12px; height:12px; border-radius:50%; background:${m50}; border:2px solid var(--surface2); box-shadow:0 0 8px ${pct>=50?color+'66':'transparent'}; transition:all 0.3s;"></div>
                <div style="width:12px; height:12px; border-radius:50%; background:${m75}; border:2px solid var(--surface2); box-shadow:0 0 8px ${pct>=75?color+'66':'transparent'}; transition:all 0.3s;"></div>
                <div style="width:14px; height:14px; border-radius:50%; background:${m100}; border:2px solid var(--surface2); box-shadow:0 0 12px ${pct>=100?color+'88':'transparent'}; transition:all 0.3s; transform:translateY(-1px);"></div>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:9px; color:var(--muted); font-weight:700;">
            <span style="color:${pct>=25?color:'var(--muted)'}">25%</span>
            <span style="color:${pct>=50?color:'var(--muted)'}">50%</span>
            <span style="color:${pct>=75?color:'var(--muted)'}">75%</span>
            <span style="color:${pct>=100?color:'var(--muted)'}">Done</span>
        </div>
    </div>`;
  return `
        <div style="animation: fade-up 0.3s ease both;">
            <div style="text-align:center; margin-bottom:30px;">
                <div style="width:80px; height:80px; background:var(--emerald); border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;">
                    <i data-lucide="user" style="width:40px; height:40px; color:#000;"></i>
                </div>
                <h2 style="color:var(--text); font-family:'Syne';">User Profile</h2>
            </div>
            
            <div class="card" style="padding:20px; border-radius:20px; background:rgba(255,255,255,0.05);">
                <label style="color:var(--muted); font-size:12px;">Gemini API Key</label>
                <input type="password" id="gemini-key" class="input" value="${localStorage.getItem('velto_gemini_key') || ''}" style="margin: 10px 0; width: 100%;">
                <button onclick="saveApiKey()" class="btn-primary" style="width:100%;">Save Settings</button>
            </div>
        </div>
    `;
}

 function saveApiKey() {
    const key = document.getElementById('gemini-key').value.trim();
    localStorage.setItem('velto_gemini_key', key);
    showToast('API Key Saved Successfully!');
}

function openProfileEdit() { document.getElementById('sheet-content').innerHTML = `<h2 class="syne" style="font-size:20px;font-weight:800;margin-bottom:20px;">Edit Profile</h2><div style="display:flex;flex-direction:column;gap:12px;"><input type="text" id="p-name" class="input" placeholder="Your name" value="${state.user.name||''}"><input type="email" id="p-email" class="input" placeholder="Email" value="${state.user.email||''}"><input type="url" id="p-photo" class="input" placeholder="Photo URL (optional)" value="${state.user.photo||''}"><button onclick="saveProfile()" class="btn-primary">Save Profile</button></div>`; openSheet(); }
function saveProfile() { state.user.name = document.getElementById('p-name').value.trim() || 'User'; state.user.email = document.getElementById('p-email').value.trim(); state.user.photo = document.getElementById('p-photo').value.trim() || null; saveState(); closeSheet(); switchTab('settings'); showToast('Profile updated!'); }
function setCurrency(code) { state.currency = SUPPORTED_CURRENCIES.find(c => c.code === code) || SUPPORTED_CURRENCIES[0]; saveState(); showToast(`Base Currency: ${state.currency.code}`); }
function exportData() { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `velto-backup-${today()}.json`; a.click(); URL.revokeObjectURL(url); showToast('Exported!'); }
function importDataPrompt() { const input = document.createElement('input'); input.type = 'file'; input.accept = '.json'; input.onchange = e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = evt => { try { const parsed = JSON.parse(evt.target.result); if (parsed.wallets && parsed.transactions) { state = parsed; saveState(); switchTab('home'); showToast('Data imported!'); } else showToast('Invalid file'); } catch { showToast('Failed to parse'); } }; reader.readAsText(file); }; input.click(); }
function confirmReset() { document.getElementById('sheet-content').innerHTML = `<div style="text-align:center;padding:10px 0;"><div style="width:60px;height:60px;border-radius:20px;background:rgba(244,63,94,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><i data-lucide="alert-triangle" style="width:28px;height:28px;color:var(--rose);"></i></div><h2 class="syne" style="font-size:20px;font-weight:800;margin-bottom:8px;">Reset Everything?</h2><p style="font-size:13px;color:var(--muted);margin-bottom:24px;">This will permanently delete all your data.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><button onclick="closeSheet()" style="padding:14px;border-radius:16px;background:var(--surface2);color:var(--text);font-weight:700;">Cancel</button><button onclick="resetData()" style="padding:14px;border-radius:16px;background:var(--rose);color:#fff;font-weight:700;">Reset</button></div></div>`; openSheet(); lucide.createIcons(); }
function resetData() { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); saveState(); closeSheet(); switchTab('home'); showToast('Data reset'); }

// ─── SHEET & TOAST ────────────────────────────────────────────────────
function openSheet() { document.getElementById('bottom-sheet').classList.add('open'); document.getElementById('overlay').style.opacity = '1'; document.getElementById('overlay').style.pointerEvents = 'auto'; lucide.createIcons(); }
function closeSheet() { document.getElementById('bottom-sheet').classList.remove('open'); document.getElementById('overlay').style.opacity = '0'; document.getElementById('overlay').style.pointerEvents = 'none'; ui.isManagingCategories = false; ui.editingTransaction = null; }
function showToast(msg, type = 'success') { const existing = document.querySelector('.toast-el'); if (existing) existing.remove(); const el = document.createElement('div'); el.className = 'toast-el toast-anim'; el.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;font-family:var(--font-main);z-index:1000;pointer-events:none;white-space:nowrap;background:${type==='error'?'var(--rose)':type==='warn'?'#f59e0b':'var(--emerald)'};color:#000;`; el.textContent = msg; document.body.appendChild(el); setTimeout(() => { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2200); }

// ─── GOOGLE DRIVE AUTO-SYNC ───────────────────────────────────────────
const GDRIVE_CLIENT_ID = '608503657584-kk54fp09cl297frfnfro32g0m0tp7o5t.apps.googleusercontent.com';
let gdrive = { connected: false, syncing: false, fileId: localStorage.getItem('velto_gdrive_fileId') || null, autoSyncEnabled: localStorage.getItem('velto_autosync') === 'true' };
let tokenClient; let accessToken = null;

function initGoogleDrive() {
    if (typeof google === 'undefined') return;
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (tokenResponse) => { if (tokenResponse && tokenResponse.access_token) { accessToken = tokenResponse.access_token; gdrive.connected = true; if (!gdrive.autoSyncEnabled) performFirstSync(); else { updateSyncButtonUI(); if(typeof showToast === 'function') showToast('Auto-sync connected ✓'); if(ui.currentTab === 'settings') switchTab('settings'); } } },
    });
    updateSyncButtonUI();
}
function handleTopSyncClick() { if (!accessToken) tokenClient.requestAccessToken(); else if (!gdrive.autoSyncEnabled) performFirstSync(); else { showToast('Syncing to Drive...'); silentAutoSync(); } }
async function performFirstSync() {
    setSyncingUI(true);
    try { const file = await findDriveFile(); if (file) { await loadFromDrive(file.id); showToast('Data restored from Drive'); } else { await saveToDrive(); showToast('Initial backup saved to Drive'); } gdrive.autoSyncEnabled = true; localStorage.setItem('velto_autosync', 'true'); updateSyncButtonUI(); if(ui.currentTab === 'settings') switchTab('settings'); }
    catch (error) { showToast('Sync failed: ' + error.message, 'error'); } finally { setSyncingUI(false); }
}
const originalSaveState = saveState;
saveState = function() { originalSaveState(); if (gdrive.autoSyncEnabled && accessToken && !gdrive.syncing) silentAutoSync(); };
let syncTimeout; function silentAutoSync() { clearTimeout(syncTimeout); syncTimeout = setTimeout(async () => { if (gdrive.syncing) return; setSyncingUI(true); try { await saveToDrive(); } catch (e) { console.error('Auto-sync error:', e); } finally { setSyncingUI(false); } }, 2500); }
async function findDriveFile() { const resp = await fetch('https://www.googleapis.com/drive/v3/files?q=name="velto_backup.json" and trashed=false&spaces=drive', { headers: { 'Authorization': `Bearer ${accessToken}` } }); const data = await resp.json(); if (data.files && data.files.length > 0) { gdrive.fileId = data.files[0].id; localStorage.setItem('velto_gdrive_fileId', gdrive.fileId); return data.files[0]; } return null; }
async function loadFromDrive(fileId) { const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { 'Authorization': `Bearer ${accessToken}` } }); const data = await resp.json(); if (data && data.wallets) { state = data; originalSaveState(); if(typeof switchTab === 'function') switchTab(ui.currentTab || 'home'); } }
async function saveToDrive() {
    const metadata = { name: 'velto_backup.json', mimeType: 'application/json' }; const form = new FormData(); form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' })); form.append('file', new Blob([JSON.stringify(state)], { type: 'application/json' }));
    let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart'; let method = 'POST';
    if (gdrive.fileId) { url = `https://www.googleapis.com/upload/drive/v3/files/${gdrive.fileId}?uploadType=multipart`; method = 'PATCH'; }
    const resp = await fetch(url, { method, headers: { 'Authorization': `Bearer ${accessToken}` }, body: form }); const result = await resp.json(); if (result.id) { gdrive.fileId = result.id; localStorage.setItem('velto_gdrive_fileId', result.id); }
}
function setSyncingUI(isSyncing) { gdrive.syncing = isSyncing; const icon = document.getElementById('sync-icon'); if (icon) { if (isSyncing) { icon.classList.add('spin'); icon.style.color = 'var(--emerald)'; } else { icon.classList.remove('spin'); updateSyncButtonUI(); } } }
function updateSyncButtonUI() { const icon = document.getElementById('sync-icon'); const btn = document.getElementById('top-sync-btn'); if (icon && btn) { if (gdrive.autoSyncEnabled && accessToken) { icon.style.color = 'var(--emerald)'; btn.style.borderColor = 'rgba(16,185,129,0.3)'; } else if (gdrive.autoSyncEnabled && !accessToken) { icon.style.color = '#f59e0b'; btn.style.borderColor = 'rgba(245,158,11,0.3)'; } else { icon.style.color = 'var(--muted)'; btn.style.borderColor = 'var(--border)'; } } }

// ─── INIT ─────────────────────────────────────────────────────────────
loadState();
window.addEventListener('load', async () => {
    await fetchRates();
    initGoogleDrive();
    switchTab('home');
});

// ─── SWIPE TO CLOSE POPUP (BOTTOM SHEET) ─────────────────────────────
const bottomSheet = document.getElementById('bottom-sheet');
let dragStartY = 0;
let currentDragY = 0;
let isDraggingSheet = false;

bottomSheet.addEventListener('touchstart', (e) => {
    // مش هنبدأ السحب غير لو المحتوى بتاع الـ popup معموله سكرول لفوق خالص
    if (bottomSheet.scrollTop <= 0) {
        dragStartY = e.touches[0].clientY;
        isDraggingSheet = true;
        // بنوقف الـ Animation مؤقتاً عشان الـ popup يتحرك مع صباعك بالمللي
        bottomSheet.style.transition = 'none'; 
    }
}, { passive: true });

bottomSheet.addEventListener('touchmove', (e) => {
    if (!isDraggingSheet) return;
    
    currentDragY = e.touches[0].clientY;
    const deltaY = currentDragY - dragStartY;

    // بنسمح بالسحب لتحت بس (قيمة موجبة)
    if (deltaY > 0) {
        // بنمنع الشاشة اللي ورا إنها تتحرك
        if (e.cancelable) e.preventDefault(); 
        bottomSheet.style.transform = `translateY(${deltaY}px)`;
    }
}, { passive: false });

bottomSheet.addEventListener('touchend', (e) => {
    if (!isDraggingSheet) return;
    isDraggingSheet = false;
    
    // بنرجع الـ Animation تاني عشان يقفل بنعومة أو يرجع مكانه
    bottomSheet.style.transition = 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1)';
    
    const deltaY = currentDragY - dragStartY;
    
    // لو سحب مسافة أكتر من 120 بيكسل، اقفل الـ Popup
    if (deltaY > 120) {
        closeSheet();
    }
    
    // في كل الحالات بنشيل الـ transform المكتوب عشان الـ CSS الأساسي يشتغل
    bottomSheet.style.transform = ''; 
    currentDragY = 0;
});
 
function updateAppIcon() {
    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const favicon = document.getElementById('app-favicon');
    const appleIcon = document.getElementById('app-apple-icon');
    
    const darkIconUrl = 'https://cdn-icons-png.flaticon.com/32/3914/3914398.png';
    const lightIconUrl = 'https://cdn-icons-png.flaticon.com/32/3135/3135679.png';
    
    if (favicon) favicon.href = isDarkMode ? darkIconUrl : lightIconUrl;
    if (appleIcon) appleIcon.href = isDarkMode ? darkIconUrl : lightIconUrl;
    
    const themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) themeColor.setAttribute('content', isDarkMode ? '#07070a' : '#ffffff');
}

updateAppIcon();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateAppIcon);

</script>
